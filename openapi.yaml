    Balance:
      type: object
      description: The merchant balance in its Account Currency.
      required: [currency, available, pending, holdingDays, rates, asOf, uncreditedCount, onHold, onHoldCount]
      properties:
        currency:
          $ref: "#/components/schemas/AccountCurrency"
        available:
          type: number
          description: Withdrawable now, exact, in `currency`.
          examples: [1250.4]
        pending:
          type: number
          description: Credits still inside the holding period, in `currency`.
          examples: [93.42]
        holdingDays:
          type: integer
          description: The holding period in days (1–7, default 2).
          examples: [2]
        display:
          description: >
            The balance in the display currency, indicative. `null` when the
            display currency is the Account Currency.
          oneOf:
            - $ref: "#/components/schemas/DisplayBalance"
            - type: "null"
        rates:
          type: object
          additionalProperties:
            type: number
          description: >
            Indicative units of each supported currency per 1 Account Currency
            unit; the Account Currency itself is `1`.
          examples: [{ CHF: 1, EUR: 1.0651, USD: 1.2412, GBP: 0.9278 }]
        asOf:
          type: string
          format: date-time
          description: When the figures were computed.
        uncreditedCount:
          type: integer
          description: Settled payments still waiting for their credit (normally 0).
          examples: [0]
        onHold:
          type: number
          description: >
            Credits of payments under an open compliance inquiry with funds on
            hold, in `currency`. Excluded from `available` and `pending`.
          examples: [0]
        onHoldCount:
          type: integer
          description: How many payments are on hold.
          examples: [0]
    DisplayBalance:
      type: object
      description: The balance re-expressed in another currency. Indicative; never moves money.
      required: [currency, rate, available, pending, onHold, indicative]
      properties:
        currency:
          $ref: "#/components/schemas/AccountCurrency"
        rate:
          type: number
          description: Units of `currency` per 1 Account Currency unit.
          examples: [1.0651]
        available:
          type: number
          examples: [1331.8]
        pending:
          type: number
          examples: [99.5]
        onHold:
          type: number
          examples: [0]
        asOf:
          type: [string, "null"]
          format: date-time
          description: The time of the rate.
        indicative:
          type: boolean
          description: Always `true`.
          examples: [true]
    AccountCurrencySettings:
      type: object
      required: [currency, changeable, currencies]
      properties:
        currency:
          $ref: "#/components/schemas/AccountCurrency"
        setBy:
          type: [string, "null"]
          enum: [merchant, staff, null]
          description: Who chose it; `null` while it is the CHF default.
        setAt:
          type: [string, "null"]
          format: date-time
        changeable:
          type: boolean
          description: Whether the balance is empty, so the currency can be changed now.
        changeBlocker:
          type: [string, "null"]
          description: Why it cannot be changed now; `null` when `changeable`.
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/AccountCurrency"
          description: The codes that can be chosen now.
      example:
        currency: EUR
        setBy: merchant
        setAt: "2026-10-20T13:05:00Z"
        changeable: true
        changeBlocker: null
        currencies: [CHF, EUR, USD, GBP]
    AccountCurrencyRequest:
      type: object
      required: [currency]
      properties:
        currency:
          $ref: "#/components/schemas/AccountCurrency"
      additionalProperties: false
    Problem:
      type: object
      description: RFC 7807 problem details (`application/problem+json`).
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        traceId:
          type: string
          description: Request correlation id — include it in support requests.
        code:
          type: string
          description: >
            Machine-readable error code: `amount_out_of_range`,
            `terms_acceptance_required` or `rate_unavailable` on the merchant
            API; `invalid_account_currency` or
            `account_currency_ledger_not_empty` on the Account Currency
            endpoint. Absent on most errors — including a disabled currency —
            so fall back to `status` and `detail`.
        minChf:
          type: number
          description: Only with `amount_out_of_range` — the minimum payment in CHF.
        maxChf:
          type: number
          description: Only with `amount_out_of_range` — your effective maximum payment in CHF.
        amountChf:
          type: number
          description: Only with `amount_out_of_range` — the CHF equivalent of the submitted amount.
      example:
        type: https://tools.ietf.org/html/rfc9110#section-15.5.1
        title: An error occurred while processing your request.
        status: 400
        detail: "currency must be one of: CHF, EUR, USD, GBP."
        traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
