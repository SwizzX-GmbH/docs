openapi: 3.1.0
info:
  title: Qint Merchant API
  version: "1.1"
  description: |
    The Qint merchant API is a server-to-server API for creating and reading
    **payment intents**. You create an intent, redirect the buyer to the returned
    `checkoutUrl` (Qint's hosted checkout at `checkout.qint.ch`), and get notified
    of status changes via [webhooks](https://docs.qint.ch/webhooks/overview).

    ### Authentication
    Every request is authenticated with a Qint-issued API key
    (`qk_live_` + 32 alphanumeric characters), sent either as
    `Authorization: Bearer qk_live_…` or as an `X-Api-Key: qk_live_…` header.
    Keys carry **Read** and/or **Write** scopes: creating intents requires
    Write, reading them requires Read. The merchant account must be approved
    before the API accepts requests.

    ### Errors
    Errors are returned as RFC 7807 `application/problem+json` documents with
    `title`, `status` and `detail` fields.

    ### Rate limits
    The merchant API is rate limited. When a limit is exceeded the API responds
    with `429 Too Many Requests` — back off and retry. Intent creation is
    retry-safe: the required `idempotencyKey` makes a retried request return
    the original intent instead of creating a duplicate.

    ### Settlement
    Every payment is credited to the merchant's balance in its **Account
    Currency** (CHF, EUR, USD or GBP; CHF by default) at the rate fixed when
    the buyer is quoted. Since 20 October 2026 a payment intent reports the
    credit as `creditAmount`, `creditCurrency` and `creditRate`; the former
    stablecoin fields `creditUsdt` and `creditAsset` are no longer returned,
    and `creditRate` changed meaning. See
    [the breaking change note](https://docs.qint.ch/api-reference/introduction#breaking-change-20-october-2026).

    ### Dashboard endpoints
    The endpoints tagged **Dashboard** serve the Qint dashboard. They
    authenticate with the dashboard's signed-in session, not with an API key,
    and are documented so that the balance, balance conversion and Account
    Currency rules are described in one place.
  contact:
    name: Qint support
    email: support@qint.ch
    url: https://qint.ch
servers:
  - url: https://api.qint.ch
    description: Production
security:
  - bearerAuth: []
  - apiKeyHeader: []
tags:
  - name: Payment intents
    description: Create standalone payments and read their status.
  - name: Currencies
    description: Which fiat currencies Qint currently offers for new payments.
  - name: Dashboard
    description: >
      The merchant balance, conversions of a previous-currency balance and
      the Account Currency, as used by the Qint dashboard. Signed-in dashboard
      session only; API keys are not accepted.
paths:
  /api/v1/intents:
    post:
      operationId: createIntent
      tags: [Payment intents]
      summary: Create a payment intent
      description: |
        Creates a standalone payment intent and returns a `checkoutUrl` to send
        the buyer to. The payment window is 15 minutes from creation
        (`expiresAt`).

        Requires the **Write** scope.

        **Idempotency** — an `idempotencyKey` (unique per merchant, e.g.
        your order id) is **required**. Retrying the same request returns the
        original intent with `200 OK` instead of creating a duplicate
        (`201 Created`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntentRequest"
            examples:
              minimal:
                summary: Minimal request
                value:
                  amount: 49.9
                  currency: CHF
                  title: "Order #1001"
                  idempotencyKey: order-1001
              withReturnUrl:
                summary: With a return URL (e.g. a shop integration)
                value:
                  amount: 49.9
                  currency: CHF
                  title: "Order #1001"
                  idempotencyKey: order-1001
                  returnUrl: https://shop.example.ch/checkout/order-received/1001
      responses:
        "201":
          description: Intent created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "200":
          description: >
            Idempotent replay — an intent with this `idempotencyKey` already
            exists for your merchant; the original intent is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "400":
          description: |
            Invalid request. Only an amount outside the allowed range (CHF 10
            to CHF 100'000 or the equivalent, or your agreed cap) carries a
            machine-readable `code` (`amount_out_of_range`, with `minChf`,
            `maxChf` and `amountChf` alongside).

            Every other 400 has **no `code`**; the reason is in `detail` only.
            That includes a currency Qint has switched off for new payments:
            `detail` reads `"{CODE} is currently disabled on Qint. currency
            must be one of: {enabled list}."`. To avoid it, check
            `GET /api/v1/public/currencies` before creating the intent; to
            recognise it after the fact, match `detail` against
            `is currently disabled on Qint`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                amountOutOfRange:
                  summary: Amount outside the payment limits
                  value:
                    title: An error occurred while processing your request.
                    status: 400
                    detail: "Payments must be between CHF 10 and CHF 100'000 (or the equivalent). This amount is CHF 5.40."
                    code: amount_out_of_range
                    minChf: 10
                    maxChf: 100000
                    amountChf: 5.4
                currencyDisabled:
                  summary: Currency switched off (no code)
                  value:
                    status: 400
                    detail: "GBP is currently disabled on Qint. currency must be one of: CHF, EUR, USD."
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The API key lacks the Write scope (no `code`), or new payments are
            paused because your account has not accepted the Qint terms in
            force (`code: terms_acceptance_required`). The pause starts on the
            terms' effective date and ends as soon as an Owner or Admin accepts
            them in the dashboard; existing intents and idempotent replays are
            not affected.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                missingScope:
                  summary: API key lacks the Write scope (no code)
                  value:
                    title: An error occurred while processing your request.
                    status: 403
                    detail: This API key lacks the Write scope.
                termsAcceptanceRequired:
                  summary: Current terms not accepted
                  value:
                    title: Terms acceptance required
                    status: 403
                    detail: "The merchant has not accepted the current Qint terms; new payments are paused until an Owner or Admin accepts them in the dashboard."
                    code: terms_acceptance_required
        "404":
          description: Merchant not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: >
            The exchange rate needed to judge a EUR, USD or GBP amount is
            unavailable. Retry in a minute.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: Service Unavailable
                status: 503
                detail: "Exchange rate unavailable — try again in a minute."
                code: rate_unavailable
    get:
      operationId: listIntents
      tags: [Payment intents]
      summary: List payment intents
      description: |
        Returns your merchant's payment intents, newest first, as a paged list.
        Optionally filter by status.

        Requires the **Read** scope.
      parameters:
        - name: status
          in: query
          required: false
          description: >
            Only return intents with this status. Values are matched
            case-insensitively (`settled` and `Settled` both work).
          schema:
            $ref: "#/components/schemas/IntentStatus"
        - name: page
          in: query
          required: false
          description: 1-based page number. Values below 1 are clamped to 1.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          required: false
          description: Items per page. Clamped to 1–100.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: A page of payment intents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedIntents"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The API key lacks the Read scope.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/public/currencies:
    get:
      operationId: listCurrencies
      tags: [Currencies]
      summary: List currencies
      security: []
      description: |
        Public, unauthenticated. Every fiat currency Qint knows, with whether it
        is offered for **new** payments right now. Qint can switch a currency
        off (and back on) at any time; while it is off, creating an intent,
        link or invoice in it is refused with `400`. That `400` has no
        machine-readable `code` — only a `detail` such as
        `GBP is currently disabled on Qint. currency must be one of: CHF, EUR, USD.`
        — so call this endpoint before creating an intent rather than parsing
        the error. Records already created in that currency keep working.

        The response is cacheable for 30 seconds — cache it on your side
        rather than calling it on every checkout.
      responses:
        "200":
          description: The currency list, in display order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyList"
              example:
                currencies:
                  - { code: CHF, enabled: true }
                  - { code: EUR, enabled: true }
                  - { code: USD, enabled: true }
                  - { code: GBP, enabled: false }
  /api/v1/intents/{id}:
    get:
      operationId: getIntent
      tags: [Payment intents]
      summary: Retrieve a payment intent
      description: |
        Returns a single payment intent by id. The status is as fresh as the
        hosted checkout's own view — an intent whose payment window has lapsed
        is reported `expired` immediately.

        Requires the **Read** scope. Intents belonging to other merchants
        return `404`.
      parameters:
        - name: id
          in: path
          required: true
          description: The payment intent id (`pi_…`).
          schema:
            type: string
          example: pi_x7k2m9p4q1w8
      responses:
        "200":
          description: The payment intent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The API key lacks the Read scope.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No intent with this id exists for your merchant.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/merchant/balances:
    get:
      operationId: getBalance
      tags: [Dashboard]
      summary: Get the balance
      security:
        - dashboardSession: []
      description: |
        The merchant's balance. Nothing is stored as a balance: the figures
        are computed on demand from credited payments, payouts that are not
        cancelled, and balance conversions. All figures are exact, each in its
        own currency; nothing is converted for display.

        - The top-level `available`, `pending` and `onHold` are the balance in
          `currency` (the Account Currency).
        - `pending` holds credits still inside the holding period
          (`holdingDays`). `onHold` holds credits of payments under an open
          compliance inquiry; they are excluded from `available` and `pending`.
        - `available` is net of every requested, scheduled or executed payout
          paid from that balance and of every conversion out of it, plus every
          conversion into it.
        - `balances` lists one entry per currency: the Account Currency always
          first, then every previous Account Currency that still holds funds
          (anything available, pending or on hold, or a payment awaiting its
          credit), in the order CHF, EUR, USD, GBP. A previous-currency balance
          can be paid out (`sourceCurrency` on the payout request) or
          [converted](https://docs.qint.ch/api-reference/convert-balance) into
          the Account Currency.
        - `rates` gives, for each supported currency, the units per 1 Account
          Currency unit (the Account Currency itself at `1`). The dashboard
          uses them to preview payouts in another currency; a payout or a
          conversion is always priced at the rate of its own request.

        Any member of the merchant account can read it. Users with access to
        several merchant accounts select one with the `X-Merchant-Id` header.
      parameters:
        - $ref: "#/components/parameters/MerchantIdHeader"
      responses:
        "200":
          description: The balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "403":
          $ref: "#/components/responses/NoMerchantAccess"
  /api/v1/merchant/balances/convert/quote:
    get:
      operationId: quoteBalanceConversion
      tags: [Dashboard]
      summary: Preview a conversion
      security:
        - dashboardSession: []
      description: |
        What converting a previous-currency balance into the Account Currency
        would book right now, with the same checks as the conversion itself.
        Nothing is stored. The dashboard's Convert dialog shows this preview.

        Any member of the merchant account can read it.
      parameters:
        - $ref: "#/components/parameters/MerchantIdHeader"
        - name: fromCurrency
          in: query
          required: true
          description: The previous-currency balance to convert.
          schema:
            $ref: "#/components/schemas/AccountCurrency"
        - name: amount
          in: query
          required: false
          description: >
            The amount to convert, in `fromCurrency`, kept to the cent. Omitted,
            the whole available amount of that balance.
          schema:
            type: number
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceConversionQuote"
        "400":
          $ref: "#/components/responses/InvalidConversion"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "403":
          $ref: "#/components/responses/NoMerchantAccess"
        "409":
          $ref: "#/components/responses/ConversionRefused"
        "503":
          $ref: "#/components/responses/RateUnavailable"
  /api/v1/merchant/balances/convert:
    post:
      operationId: convertBalance
      tags: [Dashboard]
      summary: Convert a balance
      security:
        - dashboardSession: []
      description: |
        Converts a balance held in a previous Account Currency into the current
        Account Currency. Requires the **Owner** or **Admin** role.

        - The rate is the reference rate at the time of the request, with **no
          fee and no spread**. `toAmount` is `fromAmount` × `rate`, rounded to
          the cent.
        - Only the **available** amount converts. Without `amount`, the whole
          available amount of `fromCurrency` is converted; pending and on-hold
          funds stay until they become available.
        - The converted amount is available in the Account Currency balance at
          once. A conversion is final; it cannot be reversed.
        - **Idempotent:** repeating the request with the same `idempotencyKey`
          for the same currency returns the stored conversion with `200`
          instead of booking it again (`201`).

        Not available with API keys.
      parameters:
        - $ref: "#/components/parameters/MerchantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertBalanceRequest"
            example:
              fromCurrency: EUR
              amount: 2400
              idempotencyKey: convert-eur-2026-10-20
      responses:
        "201":
          description: The conversion was booked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceConversion"
        "200":
          description: A repeated request with the same `idempotencyKey`; the stored conversion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceConversion"
        "400":
          $ref: "#/components/responses/InvalidConversion"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "403":
          $ref: "#/components/responses/NoMerchantAccess"
        "409":
          $ref: "#/components/responses/ConversionRefused"
        "503":
          $ref: "#/components/responses/RateUnavailable"
  /api/v1/merchant/balances/conversions:
    get:
      operationId: listBalanceConversions
      tags: [Dashboard]
      summary: List conversions
      security:
        - dashboardSession: []
      description: |
        The merchant's balance conversions, newest first (at most 100).

        Any member of the merchant account can read them.
      parameters:
        - $ref: "#/components/parameters/MerchantIdHeader"
      responses:
        "200":
          description: The conversions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BalanceConversion"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "403":
          $ref: "#/components/responses/NoMerchantAccess"
  /api/v1/merchant/account-currency:
    get:
      operationId: getAccountCurrency
      tags: [Dashboard]
      summary: Get the Account Currency
      security:
        - dashboardSession: []
      description: |
        The currency new payments are credited in, who set it, and the codes
        that can be chosen now (`currencies`). The Account Currency can be
        changed at any time, so `changeable` is always `true` and
        `changeBlocker` always `null`; both are kept for compatibility.

        Any member of the merchant account can read it.
      parameters:
        - $ref: "#/components/parameters/MerchantIdHeader"
      responses:
        "200":
          description: The Account Currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCurrencySettings"
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "403":
          $ref: "#/components/responses/NoMerchantAccess"
        "404":
          description: Merchant not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: setAccountCurrency
      tags: [Dashboard]
      summary: Change the Account Currency
      security:
        - dashboardSession: []
      description: |
        Sets the Account Currency to `CHF`, `EUR`, `USD` or `GBP`. Requires the
        **Owner** or **Admin** role.

        The change is allowed **at any time**, also with money on the balance.
        It decides where new credits land: a payment quoted before the change
        is credited in the currency of its quote, payments quoted after it in
        the new Account Currency. The balance in the previous currency stays in
        that currency: it can be paid out in it (`sourceCurrency` on the payout
        request) or [converted](https://docs.qint.ch/api-reference/convert-balance)
        into the new Account Currency. Funds are never converted by the change
        itself.

        A currency Qint does not offer, or has switched off, is refused with
        `400` and `code: invalid_account_currency`. Re-sending the current
        currency always succeeds.
      parameters:
        - $ref: "#/components/parameters/MerchantIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCurrencyRequest"
            example:
              currency: EUR
      responses:
        "200":
          description: The Account Currency after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCurrencySettings"
        "400":
          description: "The currency is not offered (`code: invalid_account_currency`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                title: An error occurred while processing your request.
                status: 400
                detail: "GBP is currently disabled on Qint. accountCurrency must be one of: CHF, EUR, USD."
                code: invalid_account_currency
        "401":
          $ref: "#/components/responses/NotSignedIn"
        "403":
          $ref: "#/components/responses/NoMerchantAccess"
        "404":
          description: Merchant not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  parameters:
    MerchantIdHeader:
      name: X-Merchant-Id
      in: header
      required: false
      description: >
        The merchant account to act on, for users with access to more than
        one. Not needed when the user belongs to a single merchant account.
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        `Authorization: Bearer qk_live_…` — a Qint API key created in the
        dashboard under Developers → API keys.
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        Alternative to the Authorization header — send the same `qk_live_…`
        key as `X-Api-Key`.
    dashboardSession:
      type: apiKey
      in: cookie
      name: qint_session
      description: >
        The signed-in session of the Qint dashboard (dashboard.qint.ch). Only
        the Dashboard endpoints use it; API keys are not accepted there.
  responses:
    BadRequest:
      description: >
        Invalid request — e.g. a non-positive amount, an unsupported currency
        (only CHF, EUR, USD and GBP are accepted), a currency Qint has
        currently switched off (see `GET /api/v1/public/currencies`), or a
        `returnUrl` that is not absolute https or exceeds 500 characters.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: An error occurred while processing your request.
            status: 400
            detail: "currency must be one of: CHF, EUR, USD, GBP."
    Unauthorized:
      description: Missing, malformed, revoked or unknown API key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded — back off and retry.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotSignedIn:
      description: No signed-in dashboard session.
    InvalidConversion:
      description: >
        `code: invalid_conversion`: an unknown currency, an amount of zero or
        less, or a missing `idempotencyKey` (or one longer than 200
        characters).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConversionRefused:
      description: |
        The conversion is refused; `code` says why:
        - `convert_same_currency`: `fromCurrency` is the Account Currency.
        - `insufficient_funds`: the balance has less available than requested
          (or nothing at all).
        - `idempotency_key_reused`: the key belongs to another merchant account
          or another currency.
        - `account_currency_changed`: the Account Currency changed while the
          conversion was being booked. Retry.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            title: An error occurred while processing your request.
            status: 409
            detail: "Requested 2400.01 EUR but only 2400.00 EUR is available."
            code: insufficient_funds
    RateUnavailable:
      description: "`code: rate_unavailable`: no reference rate right now. Try again shortly."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NoMerchantAccess:
      description: >
        The signed-in user is not a member of this merchant account, or (for
        a change) lacks the required role.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CurrencyList:
      type: object
      required: [currencies]
      properties:
        currencies:
          type: array
          items:
            type: object
            required: [code, enabled]
            properties:
              code:
                type: string
                description: ISO 4217 currency code.
                examples: [CHF]
              enabled:
                type: boolean
                description: Whether the currency is offered for new payments right now.
    AccountCurrency:
      type: string
      enum: [CHF, EUR, USD, GBP]
      description: >
        The fiat currency new payments are credited in (CHF unless the
        merchant chooses otherwise). It can change at any time; a balance in a
        previous Account Currency stays in that currency. Every payment is
        credited in the Account Currency of its quote, at the rate fixed when
        the buyer was quoted.
    IntentStatus:
      type: string
      description: |
        Lifecycle of a payment intent. Transitions follow
        `initiated → pending → confirmed → settled`, with `failed`, `expired`
        and `cancelled` branches. Terminal states never change again —
        except that a merchant may resolve an underpaid, expired payment as
        accepted from the dashboard review queue, which moves it
        `expired → settled`.
      enum:
        - initiated
        - pending
        - confirmed
        - settled
        - failed
        - expired
        - cancelled
    CreateIntentRequest:
      type: object
      required: [amount, currency, idempotencyKey]
      properties:
        amount:
          type: number
          description: Amount to charge, in the given fiat currency. Must be positive and, converted to CHF, between 10 and 100'000 (or your agreed cap).
          examples: [49.9]
        currency:
          type: string
          enum: [CHF, EUR, USD, GBP]
          description: >
            Invoice currency. One of `CHF`, `EUR`, `USD` or `GBP`, and only
            while Qint offers it: a currency switched off for new payments is
            refused with `400` and no `code` (check
            `GET /api/v1/public/currencies` first). It need not match your
            Account Currency: the payment is credited in your Account Currency
            at the rate fixed when the buyer is quoted.
        title:
          type: string
          description: >
            Shown to the buyer on the hosted checkout (e.g. "Order #1001").
            When omitted, the checkout falls back to your merchant display
            name.
        idempotencyKey:
          type: string
          description: >
            **Required.** Unique per merchant (use your own order or reference
            id). Retrying a request with the same key returns the original
            intent (`200`) instead of creating a duplicate (`201`). Requests
            without an `idempotencyKey` are rejected with `400`.
        returnUrl:
          type: string
          format: uri
          maxLength: 500
          description: >
            Absolute **https** URL (max 500 characters). When set, the hosted
            checkout shows a "Return to merchant" action that navigates back
            to this URL with `?qint_intent={id}&status={status}` appended.
      additionalProperties: false
    PaymentIntent:
      type: object
      description: A payment intent as returned by the merchant API.
      required:
        [id, status, amount, currency, checkoutUrl, createdAt, expiresAt, reversed, underpaid]
      properties:
        id:
          type: string
          description: Payment intent id (`pi_…`).
          examples: [pi_x7k2m9p4q1w8]
        status:
          $ref: "#/components/schemas/IntentStatus"
        amount:
          type: number
          description: The fiat amount charged.
          examples: [49.9]
        currency:
          type: string
          enum: [CHF, EUR, USD, GBP]
          description: >
            The invoice currency. `amount`, `feeAmount`, `netAmount`,
            `settledAmount` and `receivedAmount` are in it; the credit to your
            balance is in `creditCurrency`.
        title:
          type: [string, "null"]
          description: The title passed at creation, if any.
        assetSymbol:
          type: [string, "null"]
          description: >
            The crypto asset the buyer selected at checkout (e.g. `USDT`).
            `null` until the buyer picks one.
        cryptoAmount:
          type: [string, "null"]
          description: >
            The exact crypto amount the buyer must send, as an 8-decimal-place
            string (e.g. `"49.90000000"`). `null` until an asset is selected.
        depositAddress:
          type: [string, "null"]
          description: >
            The deposit address the buyer pays to. `null` until an asset is
            selected.
        checkoutUrl:
          type: string
          format: uri
          description: >
            The hosted checkout URL for this intent — redirect the buyer here.
          examples: [https://checkout.qint.ch/pay/pi_x7k2m9p4q1w8]
        returnUrl:
          type: [string, "null"]
          format: uri
          description: The `returnUrl` passed at creation, if any.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: >
            End of the payment window — 15 minutes after creation. An unpaid
            intent is `expired` after this instant.
        confirmedAt:
          type: [string, "null"]
          format: date-time
          description: When the deposit was confirmed on-chain, if it was.
        settledAt:
          type: [string, "null"]
          format: date-time
          description: When the payment settled, if it did.
        reversedAt:
          type: [string, "null"]
          format: date-time
          description: >
            Set when the payment partner reversed the payment after it had
            settled. `status` stays `settled`; treat a reversed payment as not
            paid. See the webhook reversal fields.
        reversed:
          type: boolean
          description: >
            `true` once the payment has been reversed (`reversedAt` is set),
            otherwise `false`. A flag, not a status: `status` stays `settled`.
            Treat a reversed payment as not paid.
          examples: [false]
        underpaid:
          type: boolean
          description: >
            `true` when the buyer sent less crypto than quoted. A flag, not a
            status. On an open or `expired` intent it means a short payment
            was detected; on a `settled` intent it means the payment settled
            short within your accepted underpayment (or was accepted from the
            review queue) and was credited on `receivedAmount`. See
            [underpayments](https://docs.qint.ch/guides/underpayments).
          examples: [false]
        feeAmount:
          type: [number, "null"]
          description: >
            Qint's fee deducted for this payment, in `currency`. `0` when the
            buyer paid the fee on top. Computed on the quote (on
            `receivedAmount` for a payment settled underpaid), so it agrees
            with the credit and does not change afterwards. `null` until
            `status` is `settled`.
          examples: [0.25]
        netAmount:
          type: [number, "null"]
          description: >
            The credit basis less `feeAmount`, in `currency`: `amount`, or
            `receivedAmount` for a payment settled underpaid. Computed on the
            quote. `null` until `status` is `settled`. The amount added to your
            balance is `creditAmount`, in your Account Currency.
          examples: [49.65]
        settledAmount:
          type: [number, "null"]
          description: >
            The fiat amount (in `currency`) the payment partner realised for
            the payment. Booked after settlement, so it is `null` at first and
            on most freshly settled payments. For information only: it changes
            neither `feeAmount`, `netAmount` nor the credit.
          examples: [null]
        receivedAmount:
          type: [number, "null"]
          description: >
            For a payment that is underpaid and short: the fiat amount
            actually paid (in `currency`), the basis you are credited on
            before the fee. `null` otherwise.
          examples: [null]
        underpaidBps:
          type: [integer, "null"]
          description: >
            How short an underpaid payment is, in basis points of the
            expected crypto amount (`30` = 0.3 %). `null` unless the payment
            is underpaid and short.
          examples: [null]
        creditAmount:
          type: [number, "null"]
          description: >
            What the payment added to your balance, in `creditCurrency`, 2
            decimal places: `netAmount` × `creditRate`, rounded to the cent.
            Fixed at settlement and never recomputed. `null` until the payment
            is credited, and on payments settled before 20 October 2026.
          examples: [49.65]
        creditCurrency:
          description: >
            Your Account Currency at the time of the quote — the currency
            `creditAmount` is in. `null` until credited.
          oneOf:
            - $ref: "#/components/schemas/AccountCurrency"
            - type: "null"
        creditRate:
          type: [number, "null"]
          description: >
            Units of `creditCurrency` per 1 unit of `currency`, fixed when the
            buyer was quoted (e.g. `0.9389` for EUR into CHF). `1` when the two
            currencies match. `null` until credited. Before 20 October 2026
            this field meant fiat per stablecoin unit.
          examples: [1]
      example:
        id: pi_x7k2m9p4q1w8
        status: initiated
        amount: 49.9
        currency: CHF
        title: "Order #1001"
        assetSymbol: null
        cryptoAmount: null
        depositAddress: null
        checkoutUrl: https://checkout.qint.ch/pay/pi_x7k2m9p4q1w8
        returnUrl: https://shop.example.ch/checkout/order-received/1001
        createdAt: "2026-07-08T09:15:00+00:00"
        expiresAt: "2026-07-08T09:30:00+00:00"
        confirmedAt: null
        settledAt: null
        reversedAt: null
        reversed: false
        underpaid: false
        feeAmount: null
        netAmount: null
        settledAmount: null
        receivedAmount: null
        underpaidBps: null
        creditAmount: null
        creditCurrency: null
        creditRate: null
    PagedIntents:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaymentIntent"
        total:
          type: integer
          description: Total number of intents matching the filter.
        page:
          type: integer
          description: The 1-based page number that was returned.
        pageSize:
          type: integer
          description: The page size that was applied (1–100).
      example:
        items:
          - id: pi_x7k2m9p4q1w8
            status: settled
            amount: 49.9
            currency: CHF
            title: "Order #1001"
            assetSymbol: USDT
            cryptoAmount: "55.48765432"
            depositAddress: "TX8k…"
            checkoutUrl: https://checkout.qint.ch/pay/pi_x7k2m9p4q1w8
            returnUrl: null
            createdAt: "2026-07-08T09:15:00+00:00"
            expiresAt: "2026-07-08T09:30:00+00:00"
            confirmedAt: "2026-07-08T09:21:12+00:00"
            settledAt: "2026-07-08T09:24:03+00:00"
            reversedAt: null
            reversed: false
            underpaid: false
            feeAmount: 0.5
            netAmount: 49.4
            settledAmount: null
            receivedAmount: null
            underpaidBps: null
            creditAmount: 49.4
            creditCurrency: CHF
            creditRate: 1
        total: 1
        page: 1
        pageSize: 20
    Balance:
      type: object
      description: >
        The merchant balance. The top-level figures are the Account Currency
        balance; `balances` lists every currency balance.
      required: [currency, available, pending, holdingDays, rates, asOf, uncreditedCount, onHold, onHoldCount, balances]
      properties:
        currency:
          $ref: "#/components/schemas/AccountCurrency"
        available:
          type: number
          description: Withdrawable now, exact, in `currency`.
          examples: [1250.4]
        pending:
          type: number
          description: Credits still inside the holding period, in `currency`.
          examples: [93.42]
        holdingDays:
          type: integer
          description: The holding period in days (1–7, default 2).
          examples: [2]
        rates:
          type: object
          additionalProperties:
            type: number
          description: >
            Units of each supported currency per 1 Account Currency unit; the
            Account Currency itself is `1`. For previews only: a payout or a
            conversion is priced at the rate of its own request.
          examples: [{ CHF: 1, EUR: 1.0651, USD: 1.2412, GBP: 0.9278 }]
        asOf:
          type: string
          format: date-time
          description: When the figures were computed.
        uncreditedCount:
          type: integer
          description: Settled payments still waiting for their credit (normally 0).
          examples: [0]
        onHold:
          type: number
          description: >
            Credits of payments under an open compliance inquiry with funds on
            hold, in `currency`. Excluded from `available` and `pending`.
          examples: [0]
        onHoldCount:
          type: integer
          description: How many payments are on hold.
          examples: [0]
        balances:
          type: array
          description: >
            One entry per currency: the Account Currency first, then every
            previous Account Currency that still holds funds, in the order CHF,
            EUR, USD, GBP.
          items:
            $ref: "#/components/schemas/CurrencyBalance"
      example:
        currency: CHF
        available: 1250.4
        pending: 93.42
        holdingDays: 2
        rates: { CHF: 1, EUR: 1.0651, USD: 1.2412, GBP: 0.9278 }
        asOf: "2026-10-20T18:30:00Z"
        uncreditedCount: 0
        onHold: 0
        onHoldCount: 0
        balances:
          - { currency: CHF, available: 1250.4, pending: 93.42, onHold: 0, isAccountCurrency: true }
          - { currency: EUR, available: 2400, pending: 0, onHold: 0, isAccountCurrency: false }
    CurrencyBalance:
      type: object
      description: The balance in one currency. Exact figures in `currency`.
      required: [currency, available, pending, onHold, isAccountCurrency]
      properties:
        currency:
          $ref: "#/components/schemas/AccountCurrency"
        available:
          type: number
          description: Withdrawable or convertible now, in `currency`.
          examples: [2400]
        pending:
          type: number
          description: Credits still inside the holding period, in `currency`.
          examples: [0]
        onHold:
          type: number
          description: Credits of payments on hold under a compliance inquiry, in `currency`.
          examples: [0]
        isAccountCurrency:
          type: boolean
          description: >
            `true` for the Account Currency balance, which new payments are
            credited to; `false` for a balance in a previous Account Currency.
          examples: [false]
    ConvertBalanceRequest:
      type: object
      required: [fromCurrency, idempotencyKey]
      properties:
        fromCurrency:
          $ref: "#/components/schemas/AccountCurrency"
        amount:
          type: [number, "null"]
          description: >
            The amount to convert, in `fromCurrency`, kept to the cent. Omitted
            or `null`, the whole available amount of that balance.
          examples: [2400]
        idempotencyKey:
          type: string
          maxLength: 200
          description: >
            **Required.** Your unique key for this conversion. Repeating the
            request with the same key returns the stored conversion.
          examples: [convert-eur-2026-10-20]
      additionalProperties: false
    BalanceConversion:
      type: object
      description: A conversion of a previous-currency balance into the Account Currency.
      required: [id, fromCurrency, fromAmount, toCurrency, toAmount, rate, rateSource, rateAt, idempotencyKey, createdAt]
      properties:
        id:
          type: string
          description: Conversion id (`cv_…`).
          examples: [cv_4k8m2p9q7w1x]
        fromCurrency:
          $ref: "#/components/schemas/AccountCurrency"
        fromAmount:
          type: number
          description: The amount taken from the `fromCurrency` balance.
          examples: [2400]
        toCurrency:
          $ref: "#/components/schemas/AccountCurrency"
        toAmount:
          type: number
          description: The amount added to the Account Currency balance, rounded to the cent.
          examples: [2256.48]
        rate:
          type: number
          description: Units of `toCurrency` per 1 unit of `fromCurrency`. The reference rate; no fee, no spread.
          examples: [0.9402]
        rateSource:
          type: string
          description: Where the rate came from.
        rateAt:
          type: string
          format: date-time
          description: The time of the rate.
        requestedByUserId:
          type: [string, "null"]
          format: uuid
          description: The dashboard user who requested it.
        idempotencyKey:
          type: string
        createdAt:
          type: string
          format: date-time
    BalanceConversionQuote:
      type: object
      description: What a conversion would book now. Nothing is stored.
      required: [fromCurrency, fromAmount, toCurrency, toAmount, rate, rateSource, rateAt, available]
      properties:
        fromCurrency:
          $ref: "#/components/schemas/AccountCurrency"
        fromAmount:
          type: number
          examples: [2400]
        toCurrency:
          $ref: "#/components/schemas/AccountCurrency"
        toAmount:
          type: number
          examples: [2256.48]
        rate:
          type: number
          description: Units of `toCurrency` per 1 unit of `fromCurrency`.
          examples: [0.9402]
        rateSource:
          type: string
        rateAt:
          type: string
          format: date-time
        available:
          type: number
          description: The available amount of the `fromCurrency` balance the preview was checked against.
          examples: [2400]
    AccountCurrencySettings:
      type: object
      required: [currency, changeable, currencies]
      properties:
        currency:
          $ref: "#/components/schemas/AccountCurrency"
        setBy:
          type: [string, "null"]
          enum: [merchant, staff, null]
          description: Who chose it; `null` while it is the CHF default.
        setAt:
          type: [string, "null"]
          format: date-time
        changeable:
          type: boolean
          description: Always `true`; the Account Currency can be changed at any time. Kept for compatibility.
        changeBlocker:
          type: [string, "null"]
          description: Always `null`. Kept for compatibility.
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/AccountCurrency"
          description: The codes that can be chosen now.
      example:
        currency: EUR
        setBy: merchant
        setAt: "2026-10-20T13:05:00Z"
        changeable: true
        changeBlocker: null
        currencies: [CHF, EUR, USD, GBP]
    AccountCurrencyRequest:
      type: object
      required: [currency]
      properties:
        currency:
          $ref: "#/components/schemas/AccountCurrency"
      additionalProperties: false
    Problem:
      type: object
      description: RFC 7807 problem details (`application/problem+json`).
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: Short human-readable summary.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
        traceId:
          type: string
          description: Request correlation id — include it in support requests.
        code:
          type: string
          description: >
            Machine-readable error code: `amount_out_of_range`,
            `terms_acceptance_required` or `rate_unavailable` on the merchant
            API; `invalid_account_currency` on the Account Currency endpoint;
            `invalid_conversion`, `convert_same_currency`,
            `insufficient_funds`, `idempotency_key_reused`,
            `account_currency_changed` or `rate_unavailable` on the balance
            conversion endpoints. Absent on most errors, including a disabled currency,
            so fall back to `status` and `detail`.
        minChf:
          type: number
          description: Only with `amount_out_of_range` — the minimum payment in CHF.
        maxChf:
          type: number
          description: Only with `amount_out_of_range` — your effective maximum payment in CHF.
        amountChf:
          type: number
          description: Only with `amount_out_of_range` — the CHF equivalent of the submitted amount.
      example:
        type: https://tools.ietf.org/html/rfc9110#section-15.5.1
        title: An error occurred while processing your request.
        status: 400
        detail: "currency must be one of: CHF, EUR, USD, GBP."
        traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00
